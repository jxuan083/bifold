<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>bifold</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root{
    --fg:#1b2733; --dim:#5b6b7d; --bar:#f7f9fb; --panel:#fff; --line:#dfe5ec;
    --edge:#eef2f7; --gutfg:#9aa8b8; --btn:#fff; --btnhov:#eef2f7; --accent:#173A6B;
    --onaccent:#fff; --sel:#cfe3ff; --stage:#eef1f5; --shadow:rgba(0,0,0,.12); --err:#c0392b;
    --selbg:rgba(0,120,212,.22);
  }
  /* VS Code Dark Modern 的實際色值。預覽區永遠白底，那是簡報本身，變色就看不到真實成品 */
  :root[data-t="dark"]{
    --fg:#cccccc; --dim:#9d9d9d; --bar:#181818; --panel:#1f1f1f; --line:#2b2b2b;
    --edge:#2b2b2b; --gutfg:#6e7681; --btn:#313131; --btnhov:#3c3c3c; --accent:#0078d4;
    --onaccent:#fff; --sel:#264f78; --stage:#141414; --shadow:rgba(0,0,0,.6); --err:#f14c4c;
    --selbg:rgba(88,150,220,.32);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 -apple-system,"PingFang TC",sans-serif;
            color:var(--fg);background:var(--panel)}
  body{display:flex;flex-direction:column}
  #bar{flex:0 0 46px;display:flex;align-items:center;gap:8px;padding:0 12px;
       flex-wrap:nowrap;overflow:hidden;
       border-bottom:1px solid var(--line);background:var(--bar)}
  #bar > button{flex:0 0 auto}
  #bar .name{font-weight:700;color:var(--accent);margin:0 4px;white-space:nowrap}
  /* 模式徽章。兩種模式的用途不重疊——HTML 是視覺型簡報，LaTeX 是論文履歷這類
     文件——所以不適用的功能直接不出現就好，但得讓人知道現在在哪個模式。 */
  #mode{font-size:10.5px;letter-spacing:.05em;padding:2px 7px;border-radius:4px;
        border:1px solid var(--line);color:var(--dim);white-space:nowrap;cursor:help}
  #path{flex:0 1 300px;min-width:110px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;
        background:var(--btn);color:var(--fg);font:11.5px ui-monospace,Menlo,monospace}
  button{font:inherit;padding:5px 12px;border:1px solid var(--line);background:var(--btn);
         color:var(--fg);border-radius:6px;cursor:pointer}
  button:hover{background:var(--btnhov)}
  button:disabled{opacity:.4;cursor:default}
  button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
  button:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
  #msg{margin-left:auto;flex:1 1 auto;min-width:0;text-align:right;
       color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #msg.err{color:var(--err)}
  #wrap{display:flex;flex:1;min-height:0}
  /* 終端機：真的一個 shell，所以 tectonic、git、claude 原本就在用的東西全都直接能用 */
  #termWrap{flex:0 0 var(--th,260px);display:none;flex-direction:column;
            border-top:1px solid var(--line);background:#141414;min-height:0}
  #termWrap.show{display:flex}
  #termBar{flex:0 0 26px;display:flex;align-items:center;gap:10px;padding:0 10px;
           background:var(--bar);border-bottom:1px solid var(--line);
           font-size:11px;color:var(--dim);cursor:ns-resize;user-select:none}
  #termBar b{color:var(--fg);font-weight:600}
  #termBar .cwd{font-family:ui-monospace,Menlo,monospace;overflow:hidden;
                text-overflow:ellipsis;white-space:nowrap}
  #termBar button{padding:1px 7px;font-size:11px;cursor:pointer}
  #termBar .cwd{margin-left:auto}
  #termTabs{display:flex;gap:4px;align-items:center}
  #termTabs .tab{display:flex;align-items:center;gap:5px;padding:2px 6px 2px 9px;
                 border:1px solid var(--line);border-radius:4px;cursor:pointer;
                 font-size:11px;color:var(--dim);white-space:nowrap}
  #termTabs .tab.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
  #termTabs .tab .x{opacity:.55;font-size:12px;line-height:1;padding:0 1px}
  #termTabs .tab .x:hover{opacity:1}
  #termNew{padding:1px 8px;font-size:13px;line-height:1.1}
  #termPanes{flex:1;min-height:0;position:relative}
  #termPanes .pane{position:absolute;inset:0;padding:4px 6px;display:none}
  #termPanes .pane.on{display:block}
  /* 檔案樹：論文是多檔案的，要切檔卻得手動貼絕對路徑實在很煩 */
  #tree{width:212px;flex:0 0 212px;display:none;flex-direction:column;
        border-right:1px solid var(--line);background:var(--bar);overflow:auto}
  #tree.show{display:flex}
  #tree .th{display:flex;align-items:center;gap:6px;padding:7px 8px 6px 12px;
            font-size:10.5px;color:var(--dim);letter-spacing:.08em;
            border-bottom:1px solid var(--edge)}
  #tree .th span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tree .th button{margin-left:auto;padding:0 6px;font-size:13px;line-height:1.3}
  #tName{display:none;width:calc(100% - 16px);margin:6px 8px;padding:4px 7px;
         border:1px solid var(--accent);border-radius:5px;background:var(--btn);
         color:var(--fg);font:11.5px ui-monospace,Menlo,monospace}
  #tName.show{display:block}
  #tree .d{padding:8px 12px 3px;font:10.5px ui-monospace,Menlo,monospace;color:var(--dim)}
  #tree .f{padding:4px 12px;font:12px/1.5 ui-monospace,Menlo,monospace;cursor:pointer;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tree .f:hover{background:var(--btnhov)}
  #tree .f.on{background:var(--accent);color:var(--onaccent)}
  #tree .f.main::after{content:" ●";color:var(--dim);font-size:9px;vertical-align:middle}
  #tree .f.on.main::after{color:var(--onaccent)}
  #menu{padding:5px 10px;font-size:14px;line-height:1.1}
  /* 外部改動：平常不存在，被別人改了才冒出來 */
  #ext{display:none;background:var(--err);border-color:var(--err);color:#fff}
  #ext.show{display:inline-block}
  #left{width:46%;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--panel)}
  #split{width:6px;flex:0 0 6px;cursor:col-resize;background:var(--line);position:relative}
  #split:hover,#split.drag{background:#E2730C}
  #split::after{content:"";position:absolute;inset:0 -4px}
  #pvbar{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;
         border-bottom:1px solid var(--line);background:var(--bar);font-size:12px;color:var(--dim)}
  #pvbar button{padding:3px 9px}
  #pvbar .sep{width:1px;height:15px;background:var(--line);margin:0 3px}
  #pvbar .pg{font-variant-numeric:tabular-nums;min-width:56px;text-align:center;color:var(--accent);font-weight:700}
  select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;
         background:var(--btn);color:var(--fg)}
  #find{display:none;gap:6px;padding:6px 8px;border-bottom:1px solid var(--edge);background:var(--bar)}
  #find.show{display:flex}
  #find input{flex:1;padding:4px 8px;border:1px solid var(--line);border-radius:5px;
              background:var(--btn);color:var(--fg);font:inherit}
  #ed{flex:1;display:flex;overflow:hidden}
  #gut{width:52px;padding:10px 8px 10px 0;text-align:right;background:var(--bar);color:var(--gutfg);
       border-right:1px solid var(--edge);overflow:hidden;user-select:none;
       font:11.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre}
  /* 語法高亮用疊層做，不換掉 textarea。gotoLine、搜尋、拖曳寫回 inline style、
     跟隨游標算行號全都依賴 selectionStart / setSelectionRange——換成 CodeMirror
     等於把編輯器重寫一遍。疊層只加視覺，既有行為一行都不用動。
     兩層的 font / padding / white-space / tab-size 必須逐項一致，差一點就會錯開。 */
  #codewrap{flex:1;position:relative;overflow:hidden}
  #code,#syn{position:absolute;inset:0;margin:0;padding:10px 12px;border:0;
            white-space:pre;overflow:auto;
            font:11.5px/1.55 ui-monospace,Menlo,monospace;tab-size:2}
  #syn{pointer-events:none;color:var(--fg);background:var(--panel)}
  #code{outline:0;resize:none;background:transparent;
        color:transparent;caret-color:var(--fg)}
  /* textarea 的字是透明的（字由底下那層畫），所以選取背景一定要半透明，
     不然選起來就是一塊看不到內容的實心色塊 */
  #code::selection{background:var(--selbg)}
  /* VS Code Dark Modern / Light+ 的實際色值 */
  :root{--t-kw:#0000ff;--t-str:#a31515;--t-cm:#008000;--t-tag:#800000;
        --t-attr:#e50000;--t-math:#0070c1;--t-brace:#7c4dff}
  :root[data-t="dark"]{--t-kw:#569cd6;--t-str:#ce9178;--t-cm:#6a9955;--t-tag:#569cd6;
        --t-attr:#9cdcfe;--t-math:#4ec9b0;--t-brace:#c586c0}
  #syn .kw{color:var(--t-kw)} #syn .str{color:var(--t-str)} #syn .cm{color:var(--t-cm);font-style:italic}
  #syn .tag{color:var(--t-tag)} #syn .attr{color:var(--t-attr)} #syn .math{color:var(--t-math)}
  #syn .brace{color:var(--t-brace)}
  #props{display:none;border-top:1px solid var(--line);background:var(--bar);padding:8px 10px;
         max-height:190px;overflow:auto}
  #props.show{display:block}
  #props .hd{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:7px}
  #props .hd b{color:var(--accent);font:700 11.5px ui-monospace,Menlo,monospace}
  /* 祖先路徑：點下去選到的是最內層，但要說「在這個裡面均分」時
     指的是容器。比照 DevTools 給一條可點的麵包屑。 */
  #pCrumb{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-bottom:6px}
  #pCrumb .c{padding:1px 6px;border:1px solid var(--line);border-radius:4px;cursor:pointer;
             font:11px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
  #pCrumb .c:hover{background:var(--btnhov);color:var(--fg)}
  #pCrumb .c.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
  #pCrumb .sep{color:var(--gutfg);font-size:10px}
  #props .row{display:grid;grid-template-columns:88px 1fr;gap:6px;align-items:center;margin-bottom:4px}
  #props label{font-size:11.5px;color:var(--dim);cursor:ew-resize;user-select:none;
               font-family:ui-monospace,Menlo,monospace}
  #props label.static{cursor:default}
  #props input{width:100%;padding:3px 7px;border:1px solid var(--line);border-radius:5px;
               background:var(--btn);color:var(--fg);font:11.5px ui-monospace,Menlo,monospace}
  #right{flex:1;display:flex;flex-direction:column;background:var(--stage);min-width:320px}
  #stage{flex:1;overflow:auto;padding:10px}
  #frameBox{transform-origin:top left;width:1600px}
  iframe{width:1600px;border:0;display:block;background:#fff;box-shadow:0 1px 8px var(--shadow)}
  /* .tex 模式：PDF 由 PDF.js 自己畫到 canvas 上。用內建 viewer 就拿不到點擊座標，
     也就做不成「點 PDF 跳原始碼」，那才是這個工具的主要互動。 */
  :root[data-kind="tex"] #frameBox{display:none}
  #pdfBox{display:none;flex-direction:column;align-items:center;gap:14px;padding:14px}
  :root[data-kind="tex"] #pdfBox{display:flex}
  #pdfBox .pg{position:relative;background:#fff;box-shadow:0 1px 8px var(--shadow)}
  #pdfBox canvas{display:block;cursor:text}
  /* 點過的位置閃一下，讓人確認自己點到的是哪一行 */
  #pdfBox .mark{position:absolute;background:rgba(255,45,155,.30);border-radius:2px;
                pointer-events:none;opacity:1;transition:opacity 1.1s ease-out}
  #pdfBox .mark.fade{opacity:0}
  /* 編譯錯誤：只顯示第一個錯誤與行號，完整 log 收在 details 裡。
     TeX log 動輒上千行，整包丟出來等於沒給。 */
  #err{display:none;border-top:1px solid var(--line);background:var(--bar);
       padding:8px 10px;max-height:200px;overflow:auto}
  #err.show{display:block}
  #err .hd{color:var(--err);font:700 12px ui-monospace,Menlo,monospace;margin-bottom:4px}
  #err .hd a{color:var(--accent);font-weight:400;margin-left:8px;cursor:pointer;text-decoration:underline}
  #err pre{margin:6px 0 0;font:11px/1.45 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap}
</style>
</head>
<body>

<div id="bar">
  <button id="menu" title="檔案樹">☰</button>
  <input id="path" placeholder="貼上 .html 或 .tex 的絕對路徑，Enter 開啟" spellcheck="false">
  <button id="browse" title="選檔案或整個專案資料夾">開啟…</button>
  <span id="mode"></span>
  <span class="name" id="name">—</span>
  <button id="save" class="primary">儲存 ⌘S</button>
  <button id="pick" title="⌘E 切換，Esc 退出">選取模式</button>
  <button id="build" title="建置 PPTX">PPTX</button>
  <button id="dl" title="下載建置好的 PPTX">下載</button>
  <button id="sync" title="開啟後，游標移到哪一行 PDF 就跳到那一頁。平常關著，用 ⌘E 跳一次就好">跟隨</button>
  <button id="ext" title="檔案在外部被改動，點此載入硬碟上的版本">外部已改動</button>
  <button id="ref" title="把選取的位置送進終端機 ⌘⇧E">引用</button>
  <button id="termBtn" title="終端機 ⌃`">終端機</button>
  <span id="msg">載入中…</span>
</div>

<div id="wrap">
  <div id="tree">
    <div class="th"><span id="tRoot">檔案</span><button id="tNew" title="在專案裡新增檔案">＋</button></div>
    <input id="tName" placeholder="sections/method.tex　Enter 建立" spellcheck="false">
    <div id="tlist"></div>
  </div>
  <div id="left">
    <div id="find">
      <input id="q" placeholder="搜尋原始碼…">
      <button id="prev">↑</button><button id="next">↓</button>
      <button id="closeFind">✕</button>
    </div>
    <div id="ed">
      <div id="gut"></div>
      <div id="codewrap"><pre id="syn"></pre><textarea id="code" spellcheck="false" wrap="off"></textarea></div>
    </div>
    <div id="props">
      <div id="pCrumb"></div>
      <div class="hd"><b id="pTag">—</b><span id="pLine"></span>
        <span style="margin-left:auto">拖標籤名可調數值</span></div>
      <div id="pRows"></div>
    </div>
    <div id="err">
      <div class="hd"><span id="eMsg"></span><a id="eGo">跳到該行</a><a id="eFull">完整 log</a></div>
      <pre id="eLog" style="display:none"></pre>
    </div>
  </div>
  <div id="split"></div>
  <div id="right">
    <div id="pvbar">
      <button id="reload">重新預覽</button>
      <span class="sep"></span>
      <button id="pgPrev">◀</button>
      <span class="pg" id="pgNow">– / –</span>
      <button id="pgNext">▶</button>
      <select id="zoom">
        <option value="fit">符合寬度</option>
        <option value="1">100%</option>
        <option value="0.75">75%</option>
        <option value="0.5">50%</option>
      </select>
      <button id="solo">只看預覽</button>
      <select id="hl" title="高亮樣式">
        <option value="devtools">高亮：比照 DevTools</option>
        <option value="soft">高亮：調淡版</option>
      </select>
    </div>
    <div id="stage">
      <div id="frameBox"><iframe id="pv"></iframe></div>
      <div id="pdfBox"></div>
    </div>
  </div>
</div>

<div id="termWrap">
  <div id="termBar">
    <div id="termTabs"></div>
    <button id="termNew" title="開一個新的 shell">＋</button>
    <span class="cwd" id="termCwd"></span>
    <button id="termClose" title="收起終端機">✕</button>
  </div>
  <div id="termPanes"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// ── 深色模式：純跟隨系統，沒有手動開關 ──────────────
(function () {
  const set = (t) => {
    document.documentElement.dataset.t = t;
    // 不能寫 typeof term——這個 IIFE 在 script 頂端就跑，那時 let term 還在 TDZ，
    // 而 typeof 只對「未宣告」安全，對 TDZ 中的 let 一樣會拋 ReferenceError，
    // 整個 script 會就此中斷，後面所有 let 都不會初始化。
    if (window.__syncTermTheme) window.__syncTermTheme();
  };
  const mq = matchMedia("(prefers-color-scheme: dark)");
  set(mq.matches ? "dark" : "light");
  mq.addEventListener("change", (e) => set(e.matches ? "dark" : "light"));
})();
const code = $("code"), gut = $("gut"), pv = $("pv"), msg = $("msg");
let dirty = false, picking = false;

function say(t, err) { msg.textContent = t; msg.className = err ? "err" : ""; }

function drawGutter() {
  const n = code.value.split("\n").length;
  let s = "";
  for (let i = 1; i <= n; i++) s += i + "\n";
  gut.textContent = s;
  gut.scrollTop = code.scrollTop;
  // 內容變動的路徑（輸入、載入、復原、拖曳寫回）都會經過這裡，掛一次就全涵蓋
  schedSyntax();
}
// ── 語法高亮 ────────────────────────────────────
// 疊層方案：textarea 文字透明、游標和選取保留，底下那層 <pre> 畫上色後的同一份內容。
// 自己寫 tokenizer 而不是引 Prism——只需要 LaTeX 和 HTML 兩種，
// 沒必要為此拖進一個支援兩百種語言的套件。
const ESC = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// LaTeX：註解 → 數學 → 控制序列 → 大括號。順序有意義，
// 註解要最先吃掉，否則 % 後面的東西會被當成真的指令上色。
function hlTex(src) {
  let out = "", i = 0;
  const push = (cls, txt) => (out += cls ? `<span class="${cls}">${ESC(txt)}</span>` : ESC(txt));
  while (i < src.length) {
    const c = src[i];
    if (c === "%" && src[i - 1] !== "\\") {          // 註解到行尾
      const e = src.indexOf("\n", i); const end = e < 0 ? src.length : e;
      push("cm", src.slice(i, end)); i = end; continue;
    }
    if (c === "$") {                                  // $...$ / $$...$$
      const dbl = src[i + 1] === "$";
      const mark = dbl ? "$$" : "$";
      const e = src.indexOf(mark, i + mark.length);
      const end = e < 0 ? src.length : e + mark.length;
      push("math", src.slice(i, end)); i = end; continue;
    }
    if (c === "\\") {                                 // \command 或 \{ 這種跳脫
      const m = /^\\([a-zA-Z@]+\*?|.)/.exec(src.slice(i));
      const tok = m ? m[0] : c;
      push("kw", tok); i += tok.length; continue;
    }
    if (c === "{" || c === "}" || c === "[" || c === "]") { push("brace", c); i++; continue; }
    // 一般文字：一次吃到下一個有意義的字元，避免逐字產生 span
    const nx = src.slice(i + 1).search(/[%$\\{}\[\]]/);
    const end = nx < 0 ? src.length : i + 1 + nx;
    push(null, src.slice(i, end)); i = end;
  }
  return out;
}

// CSS：簡報的 <style> 往往佔掉整份檔案一大半，不上色等於只做一半。
function hlCss(src) {
  let out = "", i = 0;
  const push = (cls, txt) => (out += cls ? `<span class="${cls}">${ESC(txt)}</span>` : ESC(txt));
  while (i < src.length) {
    if (src.startsWith("/*", i)) {
      const e = src.indexOf("*/", i); const end = e < 0 ? src.length : e + 2;
      push("cm", src.slice(i, end)); i = end; continue;
    }
    if (src[i] === '"' || src[i] === "'") {
      const q = src[i]; const e = src.indexOf(q, i + 1);
      const end = e < 0 ? src.length : e + 1;
      push("str", src.slice(i, end)); i = end; continue;
    }
    // 屬性名：行首（可含空白）到冒號，--var 也算
    const m = /^([ \t]*)(--[\w-]+|[a-zA-Z-]+)(?=\s*:)/.exec(src.slice(i));
    if (m && (i === 0 || src[i - 1] === "\n" || src[i - 1] === ";" || src[i - 1] === "{")) {
      push(null, m[1]); push("attr", m[2]); i += m[0].length; continue;
    }
    if (src[i] === "{" || src[i] === "}") { push("brace", src[i]); i++; continue; }
    if (src[i] === "#") {                      // 色碼 #fff / #1B2430
      const mm = /^#[0-9a-fA-F]{3,8}\b/.exec(src.slice(i));
      if (mm) { push("str", mm[0]); i += mm[0].length; continue; }
    }
    const nx = src.slice(i + 1).search(/[/"'{}#\n]/);
    const end = nx < 0 ? src.length : i + 1 + nx;
    push(null, src.slice(i, end)); i = end;
  }
  return out;
}

// HTML：註解 → 標籤（含屬性名與字串）→ 文字
function hlHtml(src) {
  let out = "", i = 0;
  const push = (cls, txt) => (out += cls ? `<span class="${cls}">${ESC(txt)}</span>` : ESC(txt));
  while (i < src.length) {
    if (src.startsWith("<!--", i)) {
      const e = src.indexOf("-->", i); const end = e < 0 ? src.length : e + 3;
      push("cm", src.slice(i, end)); i = end; continue;
    }
    if (src[i] === "<") {
      const e = src.indexOf(">", i); const end = e < 0 ? src.length : e + 1;
      const tag = src.slice(i, end);
      // <style> 的內容交給 CSS tokenizer。<script> 不特別處理——
      // 這個工具編的是簡報和論文，裡面的 JS 通常只有幾行。
      if (/^<style\b/i.test(tag)) {
        const close = src.toLowerCase().indexOf("</style", end);
        const cEnd = close < 0 ? src.length : close;
        out += `<span class="tag">${ESC(tag)}</span>`;
        out += hlCss(src.slice(end, cEnd));
        i = cEnd; continue;
      }
      // 標籤內部再拆：屬性字串一種色、其餘算標籤色
      let last = 0, inner = "";
      tag.replace(/("[^"]*"|'[^']*')/g, (mm, _q, off) => {
        inner += `<span class="tag">${ESC(tag.slice(last, off))}</span>`;
        inner += `<span class="str">${ESC(mm)}</span>`;
        last = off + mm.length; return mm;
      });
      inner += `<span class="tag">${ESC(tag.slice(last))}</span>`;
      out += inner; i = end; continue;
    }
    const nx = src.indexOf("<", i);
    const end = nx < 0 ? src.length : nx;
    push(null, src.slice(i, end)); i = end;
  }
  return out;
}

// 大檔案不值得為了顏色卡住打字。超過門檻就不上色，寧可沒有也不要頓。
const HL_MAX = 400000;
let hlTimer = 0;
function paintSyntax() {
  const el = $("syn");
  const src = code.value;
  if (src.length > HL_MAX) { el.textContent = src; return; }
  const tex = ST && ST.kind === "tex";
  // 結尾補一個換行，否則最後一行是空行時兩層高度會差一行
  el.innerHTML = (tex ? hlTex(src) : hlHtml(src)) + "\n";
  el.scrollTop = code.scrollTop;
  el.scrollLeft = code.scrollLeft;
}
const schedSyntax = () => { clearTimeout(hlTimer); hlTimer = setTimeout(paintSyntax, 90); };

code.addEventListener("scroll", () => {
  gut.scrollTop = code.scrollTop;
  $("syn").scrollTop = code.scrollTop;
  $("syn").scrollLeft = code.scrollLeft;
});

// ── 復原 / 重做 ──────────────────────────────────
// 程式化改 code.value（拖曳寫回）會清掉瀏覽器原生的 undo 記錄，所以自己維護一份。
const UNDO = [], REDO = [];
let snapTimer = 0;
function snapshot() {
  const v = code.value;
  if (UNDO.length && UNDO[UNDO.length - 1] === v) return;
  UNDO.push(v);
  if (UNDO.length > 200) UNDO.shift();
  REDO.length = 0;
}
// 復原後直接寫檔並重載預覽，三邊才會一致：
// 拖曳的改動是即時畫在預覽 DOM 上的，只回退原始碼會讓畫面停在改過的樣子。
let applyTimer = 0;
function restore(from, to) {
  if (!from.length) return say("沒有可復原的動作");
  to.push(code.value);
  code.value = from.pop();
  dirty = true;
  drawGutter();
  say("已" + (from === UNDO ? "復原" : "重做"));
  clearTimeout(applyTimer);
  applyTimer = setTimeout(() => save(), 250); // 連按時只套用最後一次
}
code.addEventListener("input", () => {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(snapshot, 400); // 連續打字合併成一次
  dirty = true;
  drawGutter();
  say("未儲存的修改");
  schedDraft();
});

// 即時預覽：把還沒存檔的內容送到 server 記憶體，預覽渲染那份。
// 硬碟上的檔案不動，所以「改壞了還沒存、關掉就算了」這條退路還在。
// 圖片字型這些相對路徑資源照樣從真實目錄拿，預覽仍然是真的。
//
// .tex 不能這樣做：Tectonic 讀的是硬碟，而且 \input 是相對路徑，
// 寫到別處整份都會失效——要即時就得真的自動存檔，那條退路就沒了。
let draftTimer = 0, keepScroll = null;
function schedDraft() {
  if (!ST || isTex()) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async () => {
    try {
      await fetch("/draft", { method: "POST", body: code.value });
      keepScroll = $("stage").scrollTop;   // 重繪後回到原處，不然每打一個字就跳回頂端
      pv.src = ST.previewUrl + "?t=" + Date.now();
    } catch (e) { /* server 沒了，jget 那邊會講 */ }
  }, 350);
}

// ── 載入 / 儲存 ──────────────────────────────────
let ST = null;
const isTex = () => ST && ST.kind === "tex";

// HTML 專用的功能（點選定位、屬性面板、PPTX）在 .tex 模式沒有意義：
// PDF 是編譯產物，沒有可以對應回原始碼的 DOM。反過來「跟隨游標」也只有 .tex 用得到。
function applyMode() {
  const tex = isTex();
  document.documentElement.dataset.kind = ST.kind;
  for (const id of ["pick", "build", "dl"]) $(id).style.display = tex ? "none" : "";
  // 頁碼導覽兩種模式都有意義（投影片 / PDF 頁），縮放與高亮樣式只有 HTML 用得到
  for (const id of ["zoom", "hl"]) $(id).style.display = tex ? "none" : "";
  $("sync").style.display = tex ? "" : "none";
  // 這顆按鈕作用的對象是右邊那一欄，所以它放在右邊。
  // 兩種模式都叫 Recompile，比照 Overleaf——對使用者來說都是「把右邊重做一次」。
  $("reload").textContent = "Recompile";
  $("reload").classList.toggle("primary", tex);

  $("mode").textContent = tex ? "論文" : "簡報";
  $("mode").title = tex
    ? "LaTeX 文件（論文、履歷）\n右邊是 Tectonic 編出的 PDF\n\n"
      + "· 點 PDF 上任一行跳回原始碼，跨檔自動切換\n"
      + "· ⌘E 從游標跳到 PDF 對應頁\n"
      + "· 跟隨游標可切成自動跳頁\n"
      + "· ⌘S 存檔並重新編譯"
    : "HTML 簡報（視覺排版）\n右邊就是成品本身\n\n"
      + "· ⌘E 開選取模式，點畫面跳到對應行\n"
      + "· 拖元素邊界改 margin / padding，會吸附對齊\n"
      + "· 拖屬性名稱調數值，即時反映\n"
      + "· 可匯出 PPTX";
  if (tex) {
    $("props").classList.remove("show"); picking = false; $("pick").classList.remove("on");
    // 頁面剛載入時 ST 還是 null，空 iframe 觸發的 load 事件會讓 fit() 溜過守衛，
    // 在 frameBox 上留下 transform 與 height。那之後沒人會清，PDF 就被壓成一條。
    // 與其追事件順序，不如在切模式時無條件清掉。
    $("frameBox").style.transform = "";
    $("frameBox").style.height = "";
    pv.style.height = "";
  } else {
    $("err").classList.remove("show");
    // canvas 很吃記憶體，切回 HTML 就沒必要留著上一份 PDF 的每一頁
    teardownPdf();
  }
}

// server 被關掉時 fetch 會 reject。沒有這層的話畫面完全不吭聲，
// 看起來就像「很慢」或「壞了」——實際上是後面根本沒人在聽。
async function jget(url, opt) {
  let r;
  try {
    r = await fetch(url, opt);
  } catch (e) {
    say("連不上 bifold server，它可能已經關掉了。回終端機重開再重新整理。", true);
    throw e;
  }
  return r;
}

async function load() {
  ST = await (await jget("/state")).json();
  if (!ST.kind) return say("貼上 .html 或 .tex 的絕對路徑開始", true);
  applyMode();
  // 編輯子檔時要明說實際編譯的是哪一份，否則會以為預覽壞了
  $("name").textContent = ST.name + (isTex() && !ST.isMain ? " → " + ST.main : "");
  $("path").value = ST.file;
  $("build").disabled = !ST.hasBuild;
  $("dl").disabled = !ST.hasBuild;
  code.value = await (await jget("/file")).text();
  baseText = code.value;   // 三方合併的共同祖先：你載入檔案那一刻的樣子
  drawGutter(); dirty = false;
  seenSelf = 0; $("ext").classList.remove("show");   // 換檔案就重建基準
  loadTree(); // 切檔之後要重新高亮，而且換專案時整棵樹都不一樣
  const n = code.value.split("\n").length;
  if (isTex()) { say(n + " 行 · 首次編譯可能要等 Tectonic 抓 package…"); compile(); }
  else {
    say(n + " 行" + (ST.hasBuild ? "" : "（此專案無 build-pptx.sh，不能出 PPTX）"));
    reloadPreview();
  }
}

async function openPath() {
  if (dirty && !confirm("有未儲存的修改，確定要切換檔案？")) return;
  const r = await jget("/open", { method: "POST", body: JSON.stringify({ path: $("path").value }) });
  const j = await r.json();
  if (!j.ok) return say(j.error, true);
  await load();
}
// ── 檔案樹 ──────────────────────────────────────
// 主檔標一個點：編著 sections/intro.tex 時，實際編譯的是哪一份要一眼看得出來。
async function loadTree() {
  if (!$("tree").classList.contains("show") || !ST) return;
  let t;
  try { t = await (await fetch("/tree")).json(); } catch (e) { return; }

  $("tRoot").textContent = t.root.split("/").pop() + "/";
  $("tRoot").title = t.root;
  const list = $("tlist");
  list.innerHTML = "";

  let lastDir = null;
  for (const rel of t.files) {
    const cut = rel.lastIndexOf("/");
    const dir = cut < 0 ? "" : rel.slice(0, cut);
    if (dir !== lastDir) {
      lastDir = dir;
      if (dir) {
        const d = document.createElement("div");
        d.className = "d";
        d.textContent = dir + "/";
        list.appendChild(d);
      }
    }
    const abs = t.root + "/" + rel;
    const el = document.createElement("div");
    el.className = "f" + (abs === ST.file ? " on" : "") +
                   (ST.main && rel.split("/").pop() === ST.main ? " main" : "");
    el.textContent = cut < 0 ? rel : "  " + rel.slice(cut + 1);
    el.title = rel;
    el.onclick = () => { $("path").value = abs; openPath(); };
    list.appendChild(el);
  }
}

// 用 inline 輸入而不是 prompt()：prompt 會凍住整個分頁，
// 連帶把編譯、預覽這些非同步流程一起卡住。
$("tNew").onclick = (e) => {
  e.stopPropagation();
  const box = $("tName");
  box.classList.add("show");
  box.value = "";
  box.focus();
};
$("tName").addEventListener("keydown", async (e) => {
  if (e.key === "Escape") { $("tName").classList.remove("show"); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  const name = $("tName").value.trim();
  if (!name) return;
  const j = await (await fetch("/new", { method: "POST", body: JSON.stringify({ name }) })).json();
  if (!j.ok) return say(j.error, true);
  $("tName").classList.remove("show");
  $("path").value = j.path;
  await openPath();
  say("已建立 " + name);
});

$("menu").onclick = () => {
  const on = $("tree").classList.toggle("show");
  $("menu").classList.toggle("on", on);
  localStorage.setItem("tree", on ? "1" : "0");
  loadTree();
  setTimeout(() => { fit(); updPage(); }, 0);
};
if (localStorage.getItem("tree") !== "0") {
  $("tree").classList.add("show");
  $("menu").classList.add("on");
}

// 走後端叫 macOS 原生對話框。瀏覽器自己的 <input type="file"> 拿不到絕對路徑，
// 而這個工具讀寫的是硬碟上的真實檔案，沒有絕對路徑就無從談起。
// 檔案和資料夾同一個對話框收，選到資料夾會自動找出裡面的主檔。
$("browse").onclick = async () => {
  say("等待選擇…");
  try {
    const j = await (await fetch("/pick")).json();
    if (!j.ok) return say(j.error || "已取消");
    $("path").value = j.path;
    await openPath();
  } catch (e) { say("選檔失敗：" + e.message, true); }
};
$("path").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); openPath(); } });
// 存檔。把「我讀到的是哪個版本」一起送去，server 比對硬碟現況——
// AI 在終端機改完、你又按 ⌘S，不擋的話人家的改動就沒了。
async function save(force) {
  const r = await jget("/file", {
    method: "POST",
    headers: { "X-Base-Mtime": String(seenSelf || 0), "X-Force": force ? "1" : "0" },
    body: code.value,
  });
  const j = await r.json();

  if (r.status === 409 && j.conflict) {
    seenSelf = j.mtime;              // 記住硬碟現在的版本
    $("ext").classList.add("show");
    showConflict();
    return;
  }
  if (!j.ok) return say("儲存失敗", true);

  dirty = false;
  seenSelf = j.mtime || 0;           // 自己存的不算外部改動
  $("ext").classList.remove("show");
  say("已存回 " + ST.name + "（" + j.bytes.toLocaleString() + " bytes）");
  if (isTex()) compile(); else reloadPreview();
}

// 衝突時不要偷偷選一邊。三個選項講清楚各自會失去什麼。
function showConflict() {
  const box = $("err");
  box.classList.add("show");
  $("eMsg").textContent = "存檔衝突：這個檔案在你編輯的期間被外部改過了";
  $("eGo").style.display = "none";
  const log = $("eLog");
  log.style.display = "block";
  log.innerHTML = "";
  const line = document.createElement("div");
  line.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:center";
  const mk = (label, title, fn) => {
    const b = document.createElement("button");
    b.textContent = label; b.title = title;
    b.style.cssText = "padding:3px 10px;font-size:11.5px";
    b.onclick = fn;
    line.appendChild(b);
  };
  mk("自動合併", "改到不同地方的兩邊都留下來；改到同一行的會標記出來讓你選", async () => {
    box.classList.remove("show");
    say("合併中…");
    let j;
    try {
      j = await (await fetch("/merge", {
        method: "POST",
        body: JSON.stringify({ mine: code.value, base: baseText }),
      })).json();
    } catch (e) { return say("合併失敗：" + e.message, true); }
    if (!j.ok) return say(j.error || "合併失敗", true);

    snapshot();               // 合併前先存一份，⌘Z 回得去
    code.value = j.merged;
    dirty = true;
    seenSelf = j.mtime;       // 已經把外部那份納入了，不再算衝突
    $("ext").classList.remove("show");
    drawGutter();
    if (j.conflicts) {
      const at = code.value.split("\n").findIndex((l) => l.startsWith("<<<<<<<")) + 1;
      if (at) gotoLine(at);
      say(j.conflicts + " 處改到同一行，已標記在原始碼裡（<<<<<<< 那幾行），挑完再 ⌘S", true);
    } else {
      say("兩邊改的地方沒有重疊，已合併完成。確認後 ⌘S");
    }
  });
  mk("用我的覆蓋", "把外部那份改動丟掉，寫入你現在編輯器裡的內容", async () => {
    box.classList.remove("show");
    await save(true);
  });
  mk("放棄我的，載入硬碟", "丟掉你未存的修改，改用外部那份", async () => {
    box.classList.remove("show");
    dirty = false;
    $("ext").classList.remove("show");
    await load();
    say("已載入硬碟上的版本");
  });
  mk("先不決定", "兩邊都保留原狀，你自己去比對", () => box.classList.remove("show"));
  log.appendChild(line);
  const hint = document.createElement("div");
  hint.style.cssText = "margin-top:6px;color:var(--dim)";
  hint.textContent = "想先看差異的話，終端機裡跑 git diff " + ST.name + " 最直接。";
  log.appendChild(hint);
}

$("save").onclick = () => save();

// ── 預覽 ────────────────────────────────────────
let curPage = 0;    // 目前捲到第幾頁，沒變就不重捲

function reloadPreview() {
  if (!ST) return;
  if (isTex()) renderPdf();
  else pv.src = ST.previewUrl + "?t=" + Date.now();
}

// ── PDF.js ──────────────────────────────────────
// 用動態 import 載入，這樣主程式不必是 module，其餘邏輯完全不動。
let pdfjs = null;
async function getPdfjs() {
  if (!pdfjs) {
    pdfjs = await import("/vendor/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.min.mjs";
  }
  return pdfjs;
}

const PDF_SCALE = 1.6;   // 渲染倍率。夠銳利又不會讓大論文吃掉太多記憶體
let pages = [];          // 每頁的外框 div，捲動定位用
let meta = [];           // 每頁的 PDF.js page 物件與尺寸
let renderSeq = 0;       // 用序號而不是布林旗標：旗標卡住就再也畫不出來
let pdfDoc = null;

// 只畫看得到的頁。一份 55 頁的論文如果全部畫出來，55 個 canvas 在主執行緒
// 連續渲染會讓整個分頁無回應超過 45 秒，位圖也吃掉約 260 MB——實測過，
// 那不是慢，是整個凍住。
//
// 兩件事是踩過坑才定案的：
//   1. 不預先持有所有 page 物件。先 getPage 全部、之後才 render 的話，
//      render 的 promise 會永遠不 resolve 也不拋錯。要畫的時候才 getPage。
//   2. 不用 IntersectionObserver。它在這個 flex 捲動容器裡對明顯可見的頁
//      一次都沒觸發，查不出所以然；捲動事件自己算可見範圍，55 頁掃一輪
//      成本可以忽略，而且行為完全可預測。
async function renderPdf() {
  const seq = ++renderSeq;
  const box = $("pdfBox");
  try {
    const lib = await getPdfjs();
    // 每次都換 URL，否則改完重編會拿到瀏覽器快取的舊 PDF
    const doc = await lib.getDocument({ url: "/pdf?t=" + Date.now() }).promise;
    if (seq !== renderSeq) return;

    // 只問第一頁的尺寸來建等高佔位框。絕大多數論文每頁一樣大，
    // 真的不一樣的那幾頁會在畫出來的時候把佔位框修正掉。
    const first = await doc.getPage(1);
    const vp0 = first.getViewport({ scale: PDF_SCALE });
    if (seq !== renderSeq) return;

    const keep = $("stage").scrollTop;   // 重編後留在原處，不要每次都彈回第一頁
    const frag = document.createDocumentFragment();
    const next = [], metas = [];

    for (let n = 1; n <= doc.numPages; n++) {
      const wrap = document.createElement("div");
      wrap.className = "pg";
      wrap.style.width = vp0.width + "px";
      wrap.style.height = vp0.height + "px";
      frag.appendChild(wrap);
      next.push(wrap);
      metas.push({ n, wrap, canvas: null, busy: false, seq });
    }

    teardownPdf();
    pdfDoc = doc;
    box.appendChild(frag);
    pages = next;
    meta = metas;
    $("stage").scrollTop = Math.min(keep, $("stage").scrollHeight);

    // 同步更新一次：pages 此刻確定是新的。只排 rAF 的話會有競態——
    // renderPdf 會跑兩次（載入 + 編譯完成），第一次排的 rAF 可能落在
    // 第二次 teardownPdf() 清空之後、重新賦值之前，那次就白跑了。
    updPage();
    // 再等佈局跑完補一次：剛 appendChild 時 stage.clientHeight 可能還是 0
    requestAnimationFrame(() => { updPage(); });
  } catch (e) {
    if (seq !== renderSeq) return;
    teardownPdf();
    say("PDF 顯示失敗：" + e.message, true);
  }
}

function teardownPdf() {
  for (const m of meta) dropPage(m);
  meta = []; pages = [];
  $("pdfBox").innerHTML = "";
  // 刻意不呼叫 pdfDoc.destroy()：destroy 之後那份文件的 page 再 render
  // 會永遠不 resolve 也不拋錯，任何還在飛的 paintPage 就永久掛住。
  pdfDoc = null;
}

// 上下各留一屏的緩衝，捲動時才不會看到空白框才開始畫
function updateVisiblePages() {
  if (!isTex() || !meta.length) return;
  const st = $("stage");
  // 下限保護：佈局未完成時 clientHeight 會是 0，沒有這個保護就什麼都不會畫
  const view = Math.max(st.clientHeight, 400);
  const pad = view;
  const top = st.scrollTop - pad, bot = st.scrollTop + view + pad;
  for (const m of meta) {
    const y0 = m.wrap.offsetTop, y1 = y0 + m.wrap.offsetHeight;
    if (y1 > top && y0 < bot) paintPage(m); else dropPage(m);
  }
}

// 一次只畫一頁。並行發起多個 render 時 PDF.js 會卡住——promise 不 resolve
// 也不拋錯，busy 就永久卡在 true，那一頁之後再也不會被畫。
// PDF.js 官方 viewer 自己也有 renderingQueue，同樣是序列化。
let paintQueue = Promise.resolve();

function paintPage(m) {
  if (m.canvas || m.busy || m.seq !== renderSeq || !pdfDoc) return;
  m.busy = true;
  paintQueue = paintQueue.then(() => doPaint(m)).catch(() => {});
}

async function doPaint(m) {
  try {
    if (m.canvas || m.seq !== renderSeq || !pdfDoc) return;
    const page = await pdfDoc.getPage(m.n);
    if (m.seq !== renderSeq) return;
    const vp = page.getViewport({ scale: PDF_SCALE });
    const cv = document.createElement("canvas");
    cv.width = vp.width; cv.height = vp.height;
    cv.dataset.page = m.n;

    const task = page.render({ canvasContext: cv.getContext("2d"), viewport: vp });
    // 逾時就放棄這一頁。沒有這道防線的話，一次卡住會讓整個佇列停擺。
    await Promise.race([
      task.promise,
      new Promise((_, bad) => setTimeout(() => bad(new Error("render timeout")), 15000)),
    ]).catch((e) => { try { task.cancel(); } catch (_) {} throw e; });

    // 畫完才掛上去：掛著畫的話，容器一旦被清空 promise 就永遠不 resolve
    if (m.seq === renderSeq && m.wrap.isConnected) {
      // 這一頁尺寸跟第一頁不同（橫式頁、插圖頁）就修正佔位框
      if (Math.abs(m.wrap.offsetHeight - vp.height) > 1) {
        m.wrap.style.width = vp.width + "px";
        m.wrap.style.height = vp.height + "px";
      }
      m.wrap.appendChild(cv);
      m.canvas = cv;
    }
  } catch (e) {
    /* 取消、換檔或逾時，畫到一半不算錯 */
  } finally {
    m.busy = false;   // 一定要還原，否則這一頁永久畫不出來
  }
}

// 把寬高設成 0 才會真的釋放位圖，只 remove() 元素記憶體還留著
function dropPage(m) {
  if (!m || !m.canvas) return;
  m.canvas.width = 0; m.canvas.height = 0;
  m.canvas.remove();
  m.canvas = null;
}

function scrollToPage(n) {
  const el = pages[n - 1];
  if (el) $("stage").scrollTop = el.offsetTop - 14;
}

// 點 PDF → 跳原始碼。跨檔會自動切過去，因為論文的每一節多半在自己的檔案裡。
$("pdfBox").addEventListener("click", async (e) => {
  const cv = e.target.closest("canvas");
  if (!cv || !isTex()) return;

  const r = cv.getBoundingClientRect();
  // canvas 的顯示尺寸未必等於它的像素尺寸，先換回像素再除掉渲染倍率才是 pt
  const x = (e.clientX - r.left) * (cv.width / r.width) / PDF_SCALE;
  const y = (e.clientY - r.top) * (cv.height / r.height) / PDF_SCALE;

  let j;
  try {
    j = await (await fetch(`/rsync?page=${cv.dataset.page}&x=${x}&y=${y}`)).json();
  } catch (err) { return; }
  if (!j.file) return say("那個位置沒有對得上的原始碼");

  if (j.box) markBox(cv, j.box);
  if (j.file !== ST.file) {
    if (dirty && !confirm("有未儲存的修改，確定要切到 " + j.file.split("/").pop() + "？")) return;
    $("path").value = j.file;
    await openPath();
  }
  gotoLine(j.line);
  say(j.file.split("/").pop() + " 第 " + j.line + " 行" + (j.exact ? "" : "（最接近的一行）"));
});

// 框出 SyncTeX 實際命中的範圍，而不是滑鼠點的位置。
// 反查不可能永遠精準（SyncTeX 的粒度是段落），讓它可見比假裝準確好——
// 框住整段就代表這一段只能對到同一行，那不是點歪了。
function markBox(cv, b) {
  const el = document.createElement("div");
  el.className = "mark";
  const s = PDF_SCALE;
  el.style.cssText += `left:${b.x * s}px;top:${(b.y - b.h) * s}px;` +
                      `width:${Math.max(b.w * s, 8)}px;height:${Math.max((b.h + b.d) * s, 6)}px`;
  cv.parentElement.appendChild(el);
  requestAnimationFrame(() => el.classList.add("fade"));
  setTimeout(() => el.remove(), 1300);
}
$("reload").onclick = () => (isTex() ? compile() : reloadPreview());

// ── LaTeX 編譯 ───────────────────────────────────
// 編譯期間又按了儲存就記著，等這次跑完再補一次，不要讓兩個 tectonic 並行。
let compiling = false, queued = false;
async function compile() {
  if (compiling) { queued = true; return; }
  compiling = true;
  $("reload").disabled = true;
  $("reload").textContent = "Compiling…";
  const t0 = Date.now();
  try {
    const j = await (await fetch("/compile", { method: "POST" })).json();
    showErr(j);
    if (j.ok) { say("編譯完成 · " + ((Date.now() - t0) / 1000).toFixed(1) + "s"); reloadPreview(); }
    else say("編譯失敗：" + (j.error ? j.error.msg : "看下方 log"), true);
  } catch (e) {
    say("編譯失敗：" + e.message, true);
  }
  compiling = false;
  $("reload").disabled = false;
  $("reload").textContent = "Recompile";
  if (queued) { queued = false; compile(); }
}

function showErr(j) {
  const box = $("err");
  if (j.ok) return box.classList.remove("show");
  box.classList.add("show");
  const e = j.error;
  // 行號是相對於實際編譯的主檔。編著子檔時跳行會跳錯地方，所以那時不給跳。
  const sameFile = ST.isMain;
  $("eMsg").textContent = e
    ? e.msg + (e.line ? "（" + ST.main + " 第 " + e.line + " 行）" : "")
    : "編譯失敗";
  $("eGo").style.display = e && e.line && sameFile ? "" : "none";
  $("eGo").onclick = () => gotoLine(e.line);
  $("eLog").textContent = j.log || "";
  $("eLog").style.display = "none";
}
$("eFull").onclick = () => {
  const el = $("eLog");
  el.style.display = el.style.display === "none" ? "block" : "none";
};

// ── 跟隨游標：游標在第幾行，PDF 就跳第幾頁 ──────────
// 反過來（點 PDF 跳原始碼）做不到：PDF 交給瀏覽器內建 viewer 顯示，
// 拿不到點擊座標。那要改用 PDF.js 自繪才行，見 NOTES.md。
// 預設關閉。開著的時候每打一個字、每點一下都會讓右邊跳頁，
// 讀到一半被扯走非常煩——想對位置的時候按 ⌘E 跳一次就好。
let syncOn = localStorage.getItem("sync") === "1", syncTimer = 0;
$("sync").classList.toggle("on", syncOn);
$("sync").onclick = () => {
  syncOn = !syncOn;
  $("sync").classList.toggle("on", syncOn);
  localStorage.setItem("sync", syncOn ? "1" : "0");
  say(syncOn ? "跟隨游標：開（每次移動游標都會跳頁）" : "跟隨游標：關（按 ⌘E 跳一次）");
};

// force = 使用者主動按了 ⌘E，這時候不管開關與選取狀態都要跳
async function syncToCursor(force) {
  if (!isTex() || !pages.length) return;
  if (!force) {
    if (!syncOn) return;
    // 正在拉選一段文字時不要跳。選取本身就是在讀，跳頁只會打斷。
    if (code.selectionStart !== code.selectionEnd) return;
  }
  const line = code.value.slice(0, code.selectionStart).split("\n").length;
  try {
    const j = await (await fetch("/page?line=" + line)).json();
    if (!j.page) return force && say("這一行在 PDF 上找不到對應位置");
    if (j.page !== curPage || force) {
      curPage = j.page;
      scrollToPage(j.page);
      if (force) say("第 " + line + " 行 → PDF 第 " + j.page + " 頁");
    }
  } catch (e) { /* 查不到就維持現狀，不要打斷編輯 */ }
}
const schedSync = () => { clearTimeout(syncTimer); syncTimer = setTimeout(syncToCursor, 350); };
code.addEventListener("keyup", schedSync);
code.addEventListener("click", schedSync);

let slides = [], S = 1;

pv.addEventListener("load", () => {
  // PDF 模式下 iframe 裡是瀏覽器內建的 viewer，沒有可測量的 DOM——
  // 硬去讀 scrollHeight 會拿到 0，把 iframe 高度壓成看不見。
  if (isTex()) return;
  try {
    const d = pv.contentDocument;
    pv.style.height = d.documentElement.scrollHeight + "px";
    slides = [...d.querySelectorAll("section.slide")];
  } catch (e) { slides = []; }
  fit();
  if (keepScroll != null) { $("stage").scrollTop = keepScroll; keepScroll = null; }
  updPage();
  pv.contentWindow.postMessage({ type: "hlmode", mode: $("hl").value }, "*");
  if (picking) pv.contentWindow.postMessage({ type: "pick", on: true }, "*");
});

function fit() {
  // PDF 模式不套 1600px 頁框那套縮放：這裡會把量到的 iframe 高度寫成 inline style，
  // 而 PDF iframe 的 offsetHeight 初始是 0，寫進去就把預覽壓成看不見。
  if (isTex()) return;
  const z = $("zoom").value;
  S = z === "fit" ? Math.min(1, ($("stage").clientWidth - 20) / 1600) : +z;
  $("frameBox").style.transform = "scale(" + S + ")";
  $("frameBox").style.height = pv.offsetHeight * S + "px";
  // 讓探針知道縮放比，邊界抓取範圍才不會被縮到抓不到
  try { pv.contentWindow.postMessage({ type: "scale", s: S }, "*"); } catch (e) {}
}
addEventListener("resize", fit);
$("zoom").onchange = () => { fit(); updPage(); };

// ── 頁面導覽 ─────────────────────────────────────
// 投影片與 PDF 頁共用這套導覽。差別只在 HTML 的預覽有縮放係數，PDF 的 canvas 沒有。
const pageList = () => (isTex() ? pages : slides);
const pageK = () => (isTex() ? 1 : S);

function updPage() {
  const list = pageList();
  if (!list.length) return ($("pgNow").textContent = "– / –");
  const top = $("stage").scrollTop, k = pageK();
  let n = 0;
  for (let i = 0; i < list.length; i++) if (list[i].offsetTop * k <= top + 40) n = i;
  $("pgNow").textContent = n + 1 + " / " + list.length;
  $("pgNow").dataset.n = n;
  // 掛在這裡，捲動 / 拖分隔線 / 只看預覽 / 視窗縮放就全部涵蓋，
  // 不必在每個改變視野的地方各補一次
  updateVisiblePages();
}
function goPage(n) {
  const list = pageList();
  if (!list.length) return;
  n = Math.max(0, Math.min(list.length - 1, n));
  $("stage").scrollTop = list[n].offsetTop * pageK() - (isTex() ? 14 : 0);
  updPage();
}
$("stage").addEventListener("scroll", updPage);
$("pgPrev").onclick = () => goPage(+($("pgNow").dataset.n || 0) - 1);
$("pgNext").onclick = () => goPage(+($("pgNow").dataset.n || 0) + 1);

// 只看預覽：把編輯器收起來，再按一次還原
let soloW = null;
$("solo").onclick = () => {
  const L = $("left");
  if (soloW === null) { soloW = L.style.width || "46%"; L.style.width = "0px"; $("solo").classList.add("on"); }
  else { L.style.width = soloW; soloW = null; $("solo").classList.remove("on"); }
  setTimeout(() => { fit(); updPage(); }, 0);
};

// ── 中間分隔線拖曳 ────────────────────────────────
// 拖曳期間要蓋一層遮罩，否則滑鼠移到右邊時 mousemove 會被預覽的 iframe 吃掉。
(function () {
  const sp = $("split"), L = $("left");
  let on = false, veil = null, raf = 0;

  const apply = (x) => {
    const w = Math.max(0, Math.min(innerWidth - 340, x));
    L.style.width = w + "px";
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; fit(); updPage(); });
  };

  sp.addEventListener("mousedown", (e) => {
    on = true;
    sp.classList.add("drag");
    veil = document.createElement("div");
    veil.style.cssText = "position:fixed;inset:0;z-index:99999;cursor:col-resize";
    document.body.appendChild(veil);
    document.body.style.userSelect = "none";
    soloW = null; $("solo").classList.remove("on");
    e.preventDefault();
  });

  addEventListener("mousemove", (e) => { if (on) apply(e.clientX); });

  addEventListener("mouseup", () => {
    if (!on) return;
    on = false;
    sp.classList.remove("drag");
    if (veil) { veil.remove(); veil = null; }
    document.body.style.userSelect = "";
    fit(); updPage();
  });

  sp.addEventListener("dblclick", () => { L.style.width = "46%"; fit(); updPage(); });
})();

// ── 選取模式：點預覽 → 跳到原始碼那一行 ─────────────
$("hl").onchange = () => {
  localStorage.setItem("hl", $("hl").value);
  pv.contentWindow.postMessage({ type: "hlmode", mode: $("hl").value }, "*");
};
$("hl").value = localStorage.getItem("hl") || "devtools";

$("pick").onclick = () => {
  picking = !picking;
  $("pick").classList.toggle("on", picking);
  pv.contentWindow.postMessage({ type: "pick", on: picking }, "*");
  say(picking ? "選取模式：點畫面上的元素會跳到對應的程式碼" : "選取模式已關閉");
};

addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "goto") {
    gotoLine(d.line);
    showProps(d);
    say("第 " + d.line + " 行 · <" + d.tag + "> " + d.text);
  }
  // 在畫布上拖邊界改完間距，寫回原始碼
  if (d.type === "style") writeStyle(d.i, d.prop, d.value);
});

// ── 把 CSS 寫回原始碼的 inline style ─────────────────
// 標籤序號的數法必須跟 server 注入 data-i 時完全一致，否則會寫錯地方。
const TAGS_SRC = "<(div|section|p|h1|h2|h3|h4|span|b|i|em|small|li|td|th|a|pre|code)\\b";
function tagStart(src, index) {
  const lines = src.split("\n");
  let inStyle = false, n = 0, off = 0;
  for (const line of lines) {
    if (/<style\b/i.test(line)) inStyle = true;
    if (inStyle) {
      if (/<\/style>/i.test(line)) inStyle = false;
      off += line.length + 1;
      continue;
    }
    const re = new RegExp(TAGS_SRC, "gi");
    let m;
    while ((m = re.exec(line))) {
      if (n === index) return off + m.index;
      n++;
    }
    off += line.length + 1;
  }
  return -1;
}

function setDecl(tagText, prop, value) {
  const m = tagText.match(/\sstyle\s*=\s*"([^"]*)"/i);
  if (!m) return tagText.replace(/^<([a-z0-9]+)/i, '<$1 style="' + prop + ":" + value + '"');
  let found = false;
  const decls = m[1].split(";").map((s) => s.trim()).filter(Boolean).map((d) => {
    if (d.split(":")[0].trim().toLowerCase() === prop) { found = true; return prop + ":" + value; }
    return d;
  });
  if (!found) decls.push(prop + ":" + value);
  return tagText.replace(m[0], ' style="' + decls.join(";") + '"');
}

function writeStyle(i, prop, value) {
  snapshot(); // 拖曳寫回前先存一份，才有得復原
  const src = code.value;
  const start = tagStart(src, i);
  if (start < 0) return say("找不到對應的標籤，請重新整理預覽", true);
  const gt = src.indexOf(">", start);
  if (gt < 0) return say("標籤沒有結尾", true);
  const before = src.slice(0, start);
  code.value = before + setDecl(src.slice(start, gt + 1), prop, value) + src.slice(gt + 1);
  dirty = true;
  drawGutter();
  say(prop + ": " + value + " → 第 " + (before.split("\n").length) + " 行（未儲存，⌘S 寫入）");
}

// ── 屬性面板 ────────────────────────────────────
// 間距用畫布上拖邊界調，這裡只放單值型屬性，拖標籤名改數字。
const FIELDS = [
  ["font-size", "fontSize", 1], ["line-height", "lineHeight", 0.05],
  ["letter-spacing", "letterSpacing", 0.1], ["gap", "gap", 1],
  ["width", "width", 1], ["border-radius", "borderRadius", 1],
  ["font-weight", "fontWeight", 50], ["color", "color", 0],
];
let sel = null;

function showProps(d) {
  sel = d;
  $("props").classList.add("show");

  // 祖先路徑。最後一個是目前選中的，點前面任一層就選那層。
  const bc = $("pCrumb");
  bc.innerHTML = "";
  const chain = d.chain || [];
  chain.forEach((c, idx) => {
    if (idx) {
      const sp = document.createElement("span");
      sp.className = "sep"; sp.textContent = "›";
      bc.appendChild(sp);
    }
    const b = document.createElement("span");
    b.className = "c" + (idx === chain.length - 1 ? " on" : "");
    b.textContent = c.tag + (c.cls ? "." + c.cls : "") + (c.kids ? " (" + c.kids + ")" : "");
    b.title = "第 " + c.l + " 行" + (c.kids ? "，" + c.kids + " 個子元素" : "");
    b.onclick = () => pv.contentWindow.postMessage({ type: "selectIdx", i: c.i }, "*");
    bc.appendChild(b);
  });
  $("pTag").textContent = "<" + d.tag + (d.cls ? " class=\"" + d.cls + "\"" : "") + ">";
  $("pLine").textContent = "第 " + d.line + " 行";
  const rows = $("pRows");
  rows.innerHTML = "";
  for (const [css, key, step] of FIELDS) {
    const raw = (d.css || {})[key];
    if (!raw || raw === "normal" || raw === "auto") continue;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<label class="' + (step ? "" : "static") + '">' + css + "</label>" +
                    '<input value="' + raw + '">';
    const lab = row.querySelector("label"), inp = row.querySelector("input");

    const push = (v, commit) => {
      inp.value = v;
      pv.contentWindow.postMessage({ type: "apply", i: sel.i, prop: key, value: v }, "*");
      if (commit) writeStyle(sel.i, css, v);
    };
    inp.addEventListener("change", () => push(inp.value.trim(), true));

    if (step) {
      lab.addEventListener("mousedown", (ev) => {
        const n0 = parseFloat(inp.value) || 0;
        const unit = (inp.value.match(/[a-z%]+$/i) || [""])[0];
        const x0 = ev.clientX;
        const veil = document.createElement("div");
        veil.style.cssText = "position:fixed;inset:0;z-index:99999;cursor:ew-resize";
        document.body.appendChild(veil);
        const mv = (e2) => {
          const n = Math.max(0, n0 + Math.round((e2.clientX - x0) / 2) * step);
          push(+n.toFixed(2) + unit, false);
        };
        const up = () => {
          removeEventListener("mousemove", mv); removeEventListener("mouseup", up);
          veil.remove();
          push(inp.value, true);
        };
        addEventListener("mousemove", mv); addEventListener("mouseup", up);
        ev.preventDefault();
      });
    }
    rows.appendChild(row);
  }
}

function gotoLine(line) {
  const lines = code.value.split("\n");
  let start = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) start += lines[i].length + 1;
  const end = start + (lines[line - 1] || "").length;
  code.focus();
  code.setSelectionRange(start, end);
  // 把該行捲到視野中間
  const lh = parseFloat(getComputedStyle(code).lineHeight);
  code.scrollTop = Math.max(0, (line - 1) * lh - code.clientHeight / 2);
  gut.scrollTop = code.scrollTop;
}

// ── 搜尋 ────────────────────────────────────────
let lastQ = "", lastIdx = -1;
function find(dir) {
  const q = $("q").value;
  if (!q) return;
  if (q !== lastQ) { lastQ = q; lastIdx = -1; }
  const hay = code.value;
  let i;
  if (dir > 0) {
    i = hay.indexOf(q, lastIdx + 1);
    if (i < 0) i = hay.indexOf(q);
  } else {
    i = hay.lastIndexOf(q, Math.max(0, lastIdx - 1));
    if (i < 0) i = hay.lastIndexOf(q);
  }
  if (i < 0) return say("找不到「" + q + "」", true);
  lastIdx = i;
  code.focus();
  code.setSelectionRange(i, i + q.length);
  const line = hay.slice(0, i).split("\n").length;
  const lh = parseFloat(getComputedStyle(code).lineHeight);
  code.scrollTop = Math.max(0, (line - 1) * lh - code.clientHeight / 2);
  gut.scrollTop = code.scrollTop;
  say("第 " + line + " 行");
}
$("next").onclick = () => find(1);
$("prev").onclick = () => find(-1);
$("closeFind").onclick = () => $("find").classList.remove("show");
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); find(e.shiftKey ? -1 : 1); } });

// ── 出 PPTX ─────────────────────────────────────
$("build").onclick = async () => {
  if (dirty) await save();
  say("建置中…（約 20–40 秒）");
  $("build").disabled = true;
  try {
    const j = await (await fetch("/build", { method: "POST" })).json();
    const line = (j.out || "").split("\n").filter((s) => s.trim()).pop() || "";
    say(j.ok ? "PPTX 完成 · " + line.trim() : "建置失敗：" + line, !j.ok);
  } catch (e) { say("建置失敗：" + e.message, true); }
  $("build").disabled = false;
};
$("dl").onclick = () => (location.href = "/pptx");

// ── 快捷鍵 ──────────────────────────────────────
addEventListener("keydown", (e) => {
  // 跟 VS Code 一樣用 ⌃`。注意這要在 mod 判斷之前，因為 mod 也吃 ctrlKey。
  if (e.ctrlKey && e.key === "`") { e.preventDefault(); toggleTerm(); return; }
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === "z" && !e.shiftKey) { e.preventDefault(); restore(UNDO, REDO); return; }
  if (mod && (e.key === "Z" || (e.key === "z" && e.shiftKey))) { e.preventDefault(); restore(REDO, UNDO); return; }
  if (mod && e.key === "s") { e.preventDefault(); save(); }
  if (mod && e.key === "f") { e.preventDefault(); $("find").classList.add("show"); $("q").focus(); $("q").select(); }
  // 兩種模式下語意一致：把左右兩邊對起來。
  // HTML 是「點畫面找程式碼」的選取模式，.tex 是「從游標跳到 PDF 對應頁」。
  // 不用 DevTools 慣例的 ⌘⇧C，那個會被 Chrome 自己攔走，網頁收不到。
  if (mod && e.shiftKey && (e.key === "E" || e.key === "e")) {
    e.preventDefault(); sendRef(); return;
  }
  if (mod && e.key === "e") {
    e.preventDefault();
    if (isTex()) syncToCursor(true); else $("pick").click();
  }
  if (e.key === "Escape") {
    if ($("find").classList.contains("show")) $("find").classList.remove("show");
    else if (picking) $("pick").click();
  }
});
addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// ── 終端機 ──────────────────────────────────────
// 開的是真的 shell，所以 tectonic、git、claude 這些原本就在用的東西全都直接能跑。
// 多分頁：後端本來就是一個連線一個 pty，前端多開幾個 WebSocket 就是多個 shell。
//
// 沒有 ⌘T / ⌘W：那兩個會被 Chrome 自己攔走（開新分頁 / 關閉分頁），網頁收不到。
let xterm = null;                 // 已載入的 xterm 模組
let tabs = [], actTab = null, tabSeq = 0;

const loadScript = (src) => new Promise((ok, bad) => {
  const s = document.createElement("script");
  s.src = src; s.onload = ok; s.onerror = () => bad(new Error("載入失敗：" + src));
  document.head.appendChild(s);
});

const termTheme = () => document.documentElement.dataset.t === "dark"
  ? { background: "#141414", foreground: "#cccccc", cursor: "#cccccc" }
  : { background: "#1f1f1f", foreground: "#dddddd", cursor: "#dddddd" };

// 掛到 window 讓主題切換能呼叫。直接讓那邊碰 tabs 會踩到 TDZ。
window.__syncTermTheme = () => {
  for (const t of tabs) t.term.options.theme = termTheme();
};

async function loadXterm() {
  if (xterm) return;
  await loadScript("/vendor/xterm.js");
  await loadScript("/vendor/addon-fit.js");
  xterm = { Terminal, FitAddon: FitAddon.FitAddon };
}

async function newTab() {
  try { await loadXterm(); } catch (e) { return say(e.message, true); }

  const t = { id: ++tabSeq, sock: null };
  t.pane = document.createElement("div");
  t.pane.className = "pane";
  $("termPanes").appendChild(t.pane);

  t.term = new xterm.Terminal({
    fontSize: 12,
    fontFamily: 'ui-monospace, Menlo, monospace',
    cursorBlink: true,
    theme: termTheme(),
  });
  t.fit = new xterm.FitAddon();
  t.term.loadAddon(t.fit);
  t.term.open(t.pane);

  // 只綁一次。斷線之後任何輸入都當成「我要重連」，
  // 因為那正是使用者發現斷線的時機——他總是先敲個鍵試試看。
  t.term.onData((d) => {
    if (t.sock && t.sock.readyState === 1) t.sock.send(d);
    else connectTab(t);
  });

  // 分頁按鈕
  t.btn = document.createElement("div");
  t.btn.className = "tab";
  t.btn.innerHTML = '<span></span><span class="x">✕</span>';
  t.btn.firstChild.textContent = "shell " + t.id;
  t.btn.onclick = (e) => {
    if (e.target.classList.contains("x")) { closeTab(t); return; }
    activateTab(t);
  };
  $("termTabs").appendChild(t.btn);

  tabs.push(t);
  activateTab(t);
  connectTab(t);
  return t;
}

function activateTab(t) {
  actTab = t;
  for (const x of tabs) {
    x.pane.classList.toggle("on", x === t);
    x.btn.classList.toggle("on", x === t);
  }
  setTimeout(() => { fitTab(t); t.term.focus(); }, 0);
}

function closeTab(t) {
  dropSock(t);
  try { t.term.dispose(); } catch (e) {}
  t.pane.remove(); t.btn.remove();
  tabs = tabs.filter((x) => x !== t);
  if (!tabs.length) return toggleTerm();          // 關掉最後一個就收起面板
  if (actTab === t) activateTab(tabs[tabs.length - 1]);
}

// 丟掉舊連線前先拔掉 handler。否則舊 socket 的 onclose 會在新連線建立之後
// 才觸發，把「連線中斷」寫進一個其實剛連上的終端機。
function dropSock(t) {
  if (!t.sock) return;
  t.sock.onopen = t.sock.onmessage = t.sock.onclose = t.sock.onerror = null;
  try { t.sock.close(); } catch (e) {}
  t.sock = null;
}

// pty 結束（打了 exit）、server 重啟、電腦睡醒，socket 都會關。
function connectTab(t) {
  if (t.sock && t.sock.readyState <= 1) return;   // 連線中或已連上
  dropSock(t);

  // 一定要 reset 而不是只送 \e[2J\e[H。清畫面不會清掉模式——
  // 舊 shell 開過的滑鼠追蹤與焦點回報還留著，xterm 會繼續把 ^[[<35;..M
  // 這類事件當輸入送給新 shell，新 shell 不認得就原樣回顯成一堆亂碼。
  t.term.reset();
  t.term.write("\x1b[90m連線中…\x1b[0m\r\n");

  const sock = new WebSocket("ws://" + location.host + "/term");
  t.sock = sock;
  // 每個 handler 都確認自己還是「現役」那條連線，避免舊連線亂寫
  sock.onopen = () => { if (t.sock === sock) fitTab(t); };
  sock.onmessage = (e) => { if (t.sock === sock) t.term.write(e.data); };
  sock.onclose = () => {
    if (t.sock !== sock) return;
    t.term.write("\r\n\x1b[90m[連線中斷。按任意鍵重新連線]\x1b[0m\r\n");
  };
  sock.onerror = () => {};
}

// pty 要知道視窗多大，否則 vim、less 這類全螢幕程式會畫錯
function fitTab(t) {
  if (!t) return;
  try { t.fit.fit(); } catch (e) { return; }
  if (t.sock && t.sock.readyState === 1) t.sock.send("\x00" + t.term.cols + "," + t.term.rows);
}

async function toggleTerm() {
  const on = $("termWrap").classList.toggle("show");
  $("termBtn").classList.toggle("on", on);
  localStorage.setItem("term", on ? "1" : "0");
  if (on) {
    $("termCwd").textContent = ST ? ST.file.replace(/\/[^/]+$/, "") : "";
    if (!tabs.length) await newTab(); else activateTab(actTab || tabs[0]);
  }
  fit(); updPage();
}
// 把「我指的是這裡」送進終端機。刻意只送位置不送整段內容——
// claude 有 Read/Edit，給它檔案和行號它自己會去讀，塞整段進 prompt
// 既浪費又容易和真實檔案不同步。格式比照 ripgrep 的 檔名:行號，
// AI 和人都一眼看得懂。
function refText() {
  const rel = ST.file.split("/").pop();
  const lineOf = (pos) => code.value.slice(0, pos).split("\n").length;
  const a = lineOf(code.selectionStart);
  const b = code.selectionStart === code.selectionEnd ? a : lineOf(code.selectionEnd);
  const loc = a === b ? `${rel}:${a}` : `${rel}:${a}-${b}`;

  // 選取模式選中的元素：附上 tag 與子元素數，AI 才知道「這個裡面」裝了什麼。
  // 只在選取範圍正好是該元素那一行時才附——不然你後來自己選了別段，
  // 還掛著上一次點的元素資訊就會指錯。
  if (sel && !isTex() && a === sel.line && b === sel.line) {
    const tag = sel.tag + (sel.cls ? "." + sel.cls.split(/\s+/)[0] : "");
    return `${loc} <${tag}>` + (sel.kids ? ` ${sel.kids}個子元素` : "");
  }
  return loc;
}

async function sendRef() {
  if (!ST) return;
  if (!$("termWrap").classList.contains("show")) await toggleTerm();
  if (!actTab) await newTab();
  // 等連線起來再送，否則字會掉
  for (let i = 0; i < 40 && (!actTab.sock || actTab.sock.readyState !== 1); i++)
    await new Promise((r) => setTimeout(r, 100));
  if (!actTab.sock || actTab.sock.readyState !== 1) return say("終端機還沒連上", true);

  const t = refText();
  // 不送換行：送出去只是把文字打進去，要不要執行由你決定
  actTab.sock.send(t + " ");
  actTab.term.focus();
  say("已送進終端機：" + t);
}
$("ref").onclick = sendRef;

$("termBtn").onclick = toggleTerm;
$("termNew").onclick = (e) => { e.stopPropagation(); newTab(); };
$("termClose").onclick = (e) => { e.stopPropagation(); toggleTerm(); };

// 拖 termBar 調高度
(function () {
  const bar = $("termBar");
  let on = false, veil = null;
  bar.addEventListener("mousedown", (e) => {
    if (e.target.closest("button") || e.target.closest(".tab")) return;
    on = true;
    veil = document.createElement("div");
    veil.style.cssText = "position:fixed;inset:0;z-index:99999;cursor:ns-resize";
    document.body.appendChild(veil);
    e.preventDefault();
  });
  addEventListener("mousemove", (e) => {
    if (!on) return;
    const h = Math.max(80, Math.min(innerHeight - 160, innerHeight - e.clientY));
    document.documentElement.style.setProperty("--th", h + "px");
  });
  addEventListener("mouseup", () => {
    if (!on) return;
    on = false;
    if (veil) { veil.remove(); veil = null; }
    fitTab(actTab); fit(); updPage();
  });
})();

addEventListener("resize", () => fitTab(actTab));
if (localStorage.getItem("term") === "1") toggleTerm();

// ── 外部改動偵測 ────────────────────────────────
// 終端機裡的 claude 改完檔案，編輯器如果不知道，你按 ⌘S 就會拿舊內容
// 蓋掉人家剛改的。用輪詢而不是 fs.watch：後者在 macOS 會漏事件，
// 而且很多工具是「寫暫存檔再改名」，watch 會收到一堆假事件。
let seenSelf = 0, seenLatest = 0;
let baseText = "";   // 載入當下的內容，衝突時拿來當共同祖先

async function checkExternal() {
  if (!ST) return;
  let st;
  try { st = await (await fetch("/stat")).json(); } catch (e) { return; }
  if (!st.self) return;

  if (!seenSelf) { seenSelf = st.self; seenLatest = st.latest; return; }   // 建基準

  // 正在編輯的那個檔被改了
  if (st.self !== seenSelf) {
    seenSelf = st.self; seenLatest = st.latest;
    if (dirty) {
      // 不能自動覆蓋——手上還有沒存的東西
      $("ext").classList.add("show");
      say("檔案在外部被改動了，而你有未存的修改。⌘S 會蓋掉外部的版本。", true);
    } else {
      await load();
      say("檔案在外部被改動，已重新載入");
    }
    return;
  }

  // 專案裡別的檔被改了（改的是另一個 section），左邊不用動，右邊要重編
  if (st.latest !== seenLatest) {
    seenLatest = st.latest;
    if (isTex()) { say("專案內有檔案被改動，重新編譯中…"); compile(); }
  }
}
setInterval(checkExternal, 1500);
// 背景分頁的 setInterval 會被瀏覽器節流，切回來時立刻補一次
addEventListener("visibilitychange", () => { if (!document.hidden) checkExternal(); });

$("ext").onclick = async () => {
  if (dirty && !confirm("放棄未存的修改，載入硬碟上的版本？")) return;
  dirty = false;
  $("ext").classList.remove("show");
  await load();
  say("已載入硬碟上的版本");
};

load();
</script>
</body>
</html>
